name: llm-openwebui
services:

  # ──────────────────────────────────────────────
  # FRONTEND
  # ──────────────────────────────────────────────

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3721:8080"
    volumes:
      - open-webui:/app/backend/data
      - mcp_uploads:/app/backend/data/uploads
    environment:
      # Database
      DATABASE_URL: "postgresql://${PG_USER:-openwebui}:${PG_PASS}@postgres:5432/openwebui"
      DATABASE_POOL_SIZE: "15"
      DATABASE_POOL_MAX_OVERFLOW: "20"
      DATABASE_ENABLE_SESSION_SHARING: "true"
      # Vector DB
      VECTOR_DB: "qdrant"
      QDRANT_URI: "http://qdrant:6333"
      ENABLE_QDRANT_MULTITENANCY_MODE: "true"
      QDRANT_API_KEY: "${QDRANT_API_KEY}"
      # Cache — Redis DB 0 réservé OpenWebUI
      REDIS_URL: "redis://redis:6379/0"
      ENABLE_BASE_MODELS_CACHE: "true"
      MODELS_CACHE_TTL: "300"
      ENABLE_QUERIES_CACHE: "true"
      # Performance
      THREAD_POOL_SIZE: "2000"
      ENABLE_REALTIME_CHAT_SAVE: "false"
      CHAT_RESPONSE_STREAM_DELTA_CHUNK_SIZE: "7"
      # RAG
      RAG_SYSTEM_CONTEXT: "true"
      CHUNK_MIN_SIZE_TARGET: "1000"
      TIKA_SERVER_URL: "http://tika:9998"
      # Sécurité retrieval (durcissement v0.9.6) : refuse par défaut toute
      # recherche sur une collection non-scopée (sans base de connaissances
      # explicitement autorisée). Aligne l'API OWUI avec le fail-closed déjà
      # appliqué côté agent rag (rag_agent.py) et rag_client (allow_unscoped=False).
      ENABLE_RETRIEVAL_UNSCOPED_COLLECTIONS: "false"
      # Filesystem tool pour les bases de connaissances (v0.9.6) : autorise les
      # modèles à explorer une KB via ls/cat/grep/find/head/tail/sed.
      ENABLE_KB_EXEC: "true"
      # Embedding — passe par LiteLLM pour utiliser le MÊME modèle que le
      # pipeline Alyx (rag_client). Indexation et requête doivent être alignées,
      # sinon les dimensions de vecteurs Qdrant ne correspondent pas.
      RAG_EMBEDDING_ENGINE: "openai"
      RAG_EMBEDDING_MODEL: "${RAG_EMBEDDING_MODEL:-openrouter/embedding}"
      RAG_OPENAI_API_BASE_URL: "http://litellm:4000/v1"
      RAG_OPENAI_API_KEY: "${LITELLM_MASTER_KEY}"
      # Features
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY}"
      ENABLE_IMAGE_GENERATION: "false"
      ENABLE_CODE_INTERPRETER: "true"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "true"
      ENABLE_TITLE_GENERATION: "true"
      ENABLE_TAGS_GENERATION: "true"
      # MCPO
      ENABLE_MCP_SERVERS: "true"
      MCP_SERVER_BASE_URL: "http://mcpo:8000"
      # Timeout du handshake d'initialisation MCP (v0.9.6, en secondes). Généreux
      # car mcpo démarre plusieurs serveurs en cascade (playwright lent en dernier,
      # cf. config mcpo) ; évite qu'un serveur lent fasse échouer l'init globale.
      MCP_INITIALIZE_TIMEOUT: "${MCP_INITIALIZE_TIMEOUT:-30}"
      # CSP des artifacts — injectée en <meta http-equiv> dans tout srcdoc iframe
      # (Artifacts, previews HTML/code, modales de citation). Sans elle (défaut
      # vide) un artifact généré par le LLM peut fetch n'importe où. La whitelist
      # ci-dessous = exactement les hôtes référencés par skills/* (CDN JS/CSS +
      # tuiles carto). `connect-src` énuméré = barrière anti-exfiltration (l'artifact
      # ne peut plus poster les données de session vers un hôte arbitraire). Garder
      # script/style/font alignés avec design-system.md (jsdelivr sert Tabler Icons).
      # ⚠️ PersistentConfig : l'env var ne fait que SEEDER la valeur au 1er boot ;
      # ensuite elle vit en base. Pour la changer après coup : Admin Settings ou
      # repartir d'une base vierge. Si un artifact casse → ouvrir la console de
      # l'iframe, repérer la directive violée, élargir img-src/connect-src.
      IFRAME_CSP: >-
        default-src 'none';
        script-src 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://esm.sh https://cdnjs.cloudflare.com https://tonejs.github.io https://pixijs.com;
        style-src 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com https://fonts.googleapis.com;
        font-src https://fonts.gstatic.com https://cdn.jsdelivr.net data:;
        img-src 'self' data: blob: https:;
        media-src 'self' data: blob: https:;
        connect-src https://cdn.jsdelivr.net https://unpkg.com https://esm.sh https://cdnjs.cloudflare.com https://tiles.openfreemap.org https://api.protomaps.com https://api.maptiler.com https://*.basemaps.cartocdn.com https://tile.openstreetmap.org https://*.tile.opentopomap.org;
        worker-src 'self' blob:;
        frame-src 'none';
        base-uri 'none'
      # LiteLLM + Pipelines (Alyx) — multi-source
      OPENAI_API_BASE_URLS: "http://pipelines:9099"
      OPENAI_API_KEYS: "${PIPELINES_API_KEY}"
      #SSO
      ENABLE_OAUTH_SIGNUP: ${ENABLE_OAUTH_SIGNUP}
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: ${OAUTH_MERGE_ACCOUNTS_BY_EMAIL}
      OAUTH_PROVIDER_NAME: ${OAUTH_PROVIDER_NAME}
      OPENID_PROVIDER_URL: ${OPENID_PROVIDER_URL}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OAUTH_SCOPES: ${OAUTH_SCOPES}
      OPENID_REDIRECT_URI: ${OPENID_REDIRECT_URI}
      ENABLE_LOGIN_FORM: ${ENABLE_LOGIN_FORM}
      # Mapping de rôles OAuth (v0.9.6). Mettre OAUTH_ALLOWED_ROLES="*" dans .env
      # pour accorder le rôle « user » à TOUTE personne authentifiée via le SSO
      # (pratique en contexte université/entreprise mono-IdP). Laisser vide =
      # comportement actuel. Nécessite ENABLE_OAUTH_ROLE_MANAGEMENT=true + le claim
      # de rôles de ton IdP. NB : les placeholders {{USER_EMAIL}} / {{USER_ROLE}}
      # sont désormais disponibles dans les en-têtes personnalisés des connexions
      # (OpenAI/MCP) — à configurer par connexion dans Admin Settings, pas ici.
      ENABLE_OAUTH_ROLE_MANAGEMENT: ${ENABLE_OAUTH_ROLE_MANAGEMENT:-false}
      OAUTH_ROLES_CLAIM: ${OAUTH_ROLES_CLAIM:-roles}
      OAUTH_ALLOWED_ROLES: ${OAUTH_ALLOWED_ROLES:-}
      OAUTH_ADMIN_ROLES: ${OAUTH_ADMIN_ROLES:-admin}
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
      pipelines:
        condition: service_healthy
      qdrant:
        condition: service_started
      tika:
        condition: service_started
    restart: always
    networks:
      - llm-network

  # ──────────────────────────────────────────────
  # PIPELINES — LangGraph multi-agent (Alyx)
  # ──────────────────────────────────────────────

  pipelines:
    image: ghcr.io/open-webui/pipelines:latest
    container_name: pipelines
    # Port interne uniquement — OpenWebUI s'y connecte via le réseau Docker
    # ports:
    #   - "9099:9099"
    volumes:
      - ./sub_agents:/app/pipelines
      - ./skills:/app/pipelines/skills:ro
      # Partagé avec mcpo : pandoc écrit ici les .docx/.epub/.tex demandés par
      # l'agent writer, qui re-lit le fichier pour l'embarquer en data-URI.
      - mcp_exports:/data/exports
    environment:
      PIPELINES_REQUIREMENTS_PATH: "/app/pipelines/requirements.txt"
      PYTHONPATH: "/app/pipelines"
      PIPELINES_API_KEY: "${PIPELINES_API_KEY}"
      # LiteLLM proxy interne
      LITELLM_URL: "http://litellm:4000/v1"
      LITELLM_API_KEY: "${LITELLM_MASTER_KEY}"
      # MCP proxy interne
      MCPO_URL: "http://mcpo:8000"
      # Qdrant
      QDRANT_URI: "http://qdrant:6333"
      QDRANT_API_KEY: "${QDRANT_API_KEY}"
      # Doit correspondre à l'alias d'embedding déclaré dans litellm_config.yaml
      # ET au RAG_EMBEDDING_MODEL du service open-webui (cohérence index/requête).
      RAG_EMBEDDING_MODEL: "${RAG_EMBEDDING_MODEL:-openrouter/embedding}"
      # Collection Qdrant interrogée par l'agent rag (mode multitenancy OpenWebUI).
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-open-webui_knowledge}"
      # PostgreSQL — base dédiée LangGraph
      DATABASE_URL: "postgresql://${PG_USER:-openwebui}:${PG_PASS}@postgres:5432/langgraph"
      # Cache Redis des sorties agents (DB 2 — séparée d'OpenWebUI=0 et LiteLLM=1)
      REDIS_URL: "redis://redis:6379/2"
      # Open WebUI — upload de pièces jointes natives (agent writer). Le token est
      # optionnel : sans lui, le pipeline retombe sur les liens data-URI.
      WEBUI_URL: "http://open-webui:8080"
      WEBUI_API_KEY: "${WEBUI_API_KEY:-}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9099/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
      mcpo:
        condition: service_started
      qdrant:
        condition: service_started
      open-terminal:
        condition: service_started
    restart: always
    networks:
      - llm-network

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    container_name: litellm
    ports:
      - "4000:4000"   # API + UI d'administration
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    environment:
      # Base dédiée, même instance postgres
      DATABASE_URL: "postgresql://${PG_USER:-openwebui}:${PG_PASS}@postgres:5432/litellm"
      # Index Redis séparé (DB 1) pour éviter toute collision avec OpenWebUI (DB 0)
      REDIS_URL: "redis://redis:6379/1"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
      LITELLM_SALT_KEY: "${LITELLM_SALT_KEY}"
      # UI d'administration LiteLLM
      UI_USERNAME: "${LITELLM_UI_USERNAME:-admin}"
      UI_PASSWORD: "${LITELLM_UI_PASSWORD}"
      STORE_MODEL_IN_DB: "${STORE_MODEL_IN_DB:-True}"
      # Clés fournisseurs (toutes optionnelles, selon usage)
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_API_BASE: "${OPENROUTER_API_BASE:-https://openrouter.ai/api/v1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      AZURE_API_KEY: "${AZURE_API_KEY:-}"
      AZURE_API_BASE: "${AZURE_API_BASE:-}"
      AZURE_API_VERSION: "${AZURE_API_VERSION:-}"
      POLLINATIONS_API_KEY: "${POLLINATIONS_API_KEY:-}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - llm-network

  # ──────────────────────────────────────────────
  # BASE DE DONNÉES
  # ──────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: openwebui-postgres
    environment:
      POSTGRES_DB: openwebui
      POSTGRES_USER: ${PG_USER:-openwebui}
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script d'init : crée la base "litellm" au premier démarrage
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-openwebui} -d openwebui"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - llm-network

  # ──────────────────────────────────────────────
  # VECTOR DB
  # ──────────────────────────────────────────────

  qdrant:
    image: qdrant/qdrant:latest
    container_name: openwebui-qdrant
    # ports:
    #   - "6333:6333"
    #   - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY}"
      QDRANT__SERVICE__GRPC_PORT: "6334"
    restart: always
    networks:
      - llm-network

  # ──────────────────────────────────────────────
  # CACHE
  # ──────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: openwebui-redis
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --databases 16
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - llm-network

  # ──────────────────────────────────────────────
  # MCP PROXY — outils (memory, duckdb, etc.)
  # ──────────────────────────────────────────────

  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    container_name: mcpo
    ports:
      - "3722:8000"
    command: ["mcpo", "--config", "/config/mcpo_config.json"]
    init: true
    volumes:
      - ./mcpo_config.json:/config/mcpo_config.json:ro,Z
      - mcp_cache:/cache
      - mcp_memory:/data/memory
      - mcp_duckdb:/data/duckdb
      - mcp_uploads:/data/uploads
      - mcp_exports:/data/exports
      - mcp_papers:/data/papers
    environment:
      CONTEXT7_API_KEY: "${CONTEXT7_API_KEY:-}"
      OPEN_TERMINAL_API_KEY: "${OPEN_TERMINAL_API_KEY:-}"
      UV_CACHE_DIR: "/cache/uv"
      npm_config_cache: "/cache/npm"
    depends_on:
      playwright:
        condition: service_started
    restart: always
    networks:
      - llm-network

  # ──────────────────────────────────────────────
  # PLAYWRIGHT — navigateur headless (fallback agent web)
  # ──────────────────────────────────────────────

  playwright:
    image: mcr.microsoft.com/playwright/mcp:latest
    container_name: playwright-mcp
    # L'image officielle embarque Chromium + toutes ses libs système, ce que
    # l'image mcpo n'a pas (d'où les 500 sur browser_navigate quand MCPO lançait
    # @playwright/mcp via npx dans son propre conteneur). On la démarre en serveur
    # MCP streamable-HTTP — et non en stdio — pour que MCPO s'y connecte par URL
    # (cf. mcpo_config.json → playwright). Invocation recommandée par la doc
    # @playwright/mcp pour Docker : entrypoint `node /app/cli.js`, --no-sandbox
    # obligatoire en conteneur (seul headless chromium y est supporté).
    init: true
    entrypoint: ["node", "/app/cli.js"]
    command:
      - "--headless"
      - "--browser"
      - "chromium"
      - "--no-sandbox"
      - "--isolated"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8931"
      # Sans ce flag, playwright-mcp valide l'en-tête Host (protection
      # DNS-rebinding) et ne tolère QUE le host de bind → MCPO se connecte avec
      # `Host: playwright:8931` et reçoit un 403 Forbidden (cf. logs 31/05
      # 08:18:47). Le port n'étant PAS exposé hors du réseau Docker interne, on
      # désactive la vérification (`*`). La doc @playwright/mcp précise que ce
      # contrôle "n'est pas une frontière de sécurité". cf. microsoft/playwright-mcp#1373.
      - "--allowed-hosts"
      - "*"
    # Port interne uniquement — MCPO l'atteint via le réseau Docker.
    # ports:
    #   - "8931:8931"
    restart: always
    networks:
      - llm-network

  # ──────────────────────────────────────────────
  # DOCUMENT PARSING
  # ──────────────────────────────────────────────

  tika:
    image: apache/tika:latest-full
    container_name: tika
    # ports:
    #   - "9998:9998"
    restart: unless-stopped
    networks:
      - llm-network

  # ──────────────────────────────────────────────
  # TERMINAL WEB
  # ──────────────────────────────────────────────

  open-terminal:
    image: ghcr.io/open-webui/open-terminal
    container_name: open-terminal
    environment:
      OPEN_TERMINAL_API_KEY: "${OPEN_TERMINAL_API_KEY}"
    volumes:
      - open_terminal_data:/home/user
    # ports:
    #   - "3723:8000"
    restart: unless-stopped
    networks:
      - llm-network

  # ──────────────────────────────────────────────
  # OIKB — synchronisation des bases de connaissances (OPT-IN, v0.9.6)
  # ──────────────────────────────────────────────
  # Service OPTIONNEL (profile "oikb") : alimente une KB OpenWebUI depuis une
  # source (répertoire local monté, repo GitHub, S3…) avec diff SHA-256 incrémental
  # → seuls les fichiers nouveaux/modifiés sont (ré)uploadés. La KB synchronisée
  # est ensuite interrogeable par l'agent `rag` (collection open-webui_knowledge).
  #
  # Pré-requis :
  #   1. Créer une KB dans OpenWebUI, noter son ID (UUID).
  #   2. Générer une clé API (Settings → Account → API Keys, format sk-...).
  #   3. Renseigner OIKB_* dans .env, déposer les fichiers dans OIKB_SOURCE_DIR.
  # Démarrer le daemon (syncs planifiés via oikb/.oikb.yaml) :
  #   docker compose --profile oikb up -d oikb
  # OU sync ponctuel sans daemon (commande vérifiée) :
  #   docker compose --profile oikb run --rm oikb oikb sync /docs --kb-id "$OIKB_KB_ID"
  oikb:
    image: ghcr.io/open-webui/oikb:latest
    container_name: oikb
    profiles: ["oikb"]
    environment:
      OPEN_WEBUI_URL: "http://open-webui:8080"
      OPEN_WEBUI_API_KEY: "${OIKB_API_KEY:-}"
      KB_ID: "${OIKB_KB_ID:-}"
    volumes:
      - ${OIKB_SOURCE_DIR:-./oikb/docs}:/docs:ro
      - ./oikb/.oikb.yaml:/app/.oikb.yaml:ro
      - oikb_state:/app/.oikb
    # Daemon = sync continu selon oikb/.oikb.yaml. Surcharger pour un mode ponctuel.
    command: ${OIKB_CMD:-oikb daemon}
    depends_on:
      open-webui:
        condition: service_started
    restart: unless-stopped
    networks:
      - llm-network

# ──────────────────────────────────────────────
# VOLUMES
# ──────────────────────────────────────────────

volumes:
  open-webui:
    driver: local
  postgres_data:
    driver: local
  qdrant_storage:
    driver: local
  redis_data:
    driver: local
  mcp_cache:
    driver: local
  mcp_memory:
    driver: local
  mcp_duckdb:
    driver: local
  mcp_uploads:
    driver: local
  mcp_exports:
    driver: local
  mcp_papers:
    driver: local
  open_terminal_data:
    driver: local
  oikb_state:
    driver: local

# ──────────────────────────────────────────────
# RÉSEAU
# ──────────────────────────────────────────────

networks:
  llm-network:
    external: true